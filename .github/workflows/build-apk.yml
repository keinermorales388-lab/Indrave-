
name: Build Filtro de Carreras APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto Android
        shell: bash
        run: |
          mkdir -p unpacked
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró el ZIP del proyecto en la raíz."
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d unpacked
          PROJECT_DIR=$(find unpacked -name settings.gradle.kts -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se encontró el proyecto Gradle dentro del ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug -Pkotlin.jvm.target.validation.mode=warning

      - name: Guardar APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: FiltroCarreras-debug-apk
          path: unpacked/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

